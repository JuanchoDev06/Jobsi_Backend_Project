version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: jobsy-db
    restart: always
    environment:
      POSTGRES_DB: jobsy
      POSTGRES_USER: jobsy_user
      POSTGRES_PASSWORD: jobsy_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: jobsy-app
    restart: always
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILE: prod
      SERVER_PORT: 8080

      BD_URL: jdbc:postgresql://postgres:5432/jobsy
      BD_USERNAME: jobsy_user
      BD_PASSWORD: jobsy_pass

      CORS_ALLOWED_ORIGINS: "*"

volumes:
  postgres_data:
